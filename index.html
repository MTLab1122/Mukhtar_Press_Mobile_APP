    <script>
      // Defensive fix for frame extensions attempting to reassign window.fetch
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = function() {
            return _rawFetch.apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Ignore if descriptor modification fails
        }

        // Intercept uncaught extension errors (e.g. frame_ant / chrome-extension)
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var stack = (reason && reason.stack) ? String(reason.stack) : '';
          var message = (reason && reason.message) ? String(reason.message) : String(reason || '');
          if (
            stack.indexOf('chrome-extension://') !== -1 ||
            message.indexOf('fetch of #<Window>') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
